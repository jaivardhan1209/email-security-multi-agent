[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-security-multi-agent"
version = "0.1.0"
description = "Defender-style multi-agent email protection POC on Microsoft Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.17.0,<2",
    "agent-framework-ollama>=1.17.0,<2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
huggingface = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.33"]
foundry = ["agent-framework-azure-ai>=1.17.0,<2", "azure-identity>=1.17"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
email-security = "app:main"
email-security-ui = "server:main"

[tool.setuptools.packages.find]
include = ["email_security*"]

[tool.setuptools]
py-modules = ["app", "server"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF", "BLE"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
